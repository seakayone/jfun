plugins {
    id 'jfun-conventions'

    id 'maven-publish'
}


publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.kleinb'
            artifactId = 'jfun-core'

            from components.java

            pom {
                name = 'jfun-core'
                description = 'Functional data structures for modern Java'
                url = 'https://github.com/seakayone/jfun'
                inceptionYear = '2024'
                licenses {
                    license {
                        name = 'Apache-2.0'
                        url = 'https://spdx.org/licenses/Apache-2.0.html'
                    }
                }
                developers {
                    developer {
                        id = 'seakayone'
                        name = 'Christian Kleinbölting'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/seakayone/jfun'
                    developerConnection = 'scm:git:ssh://github.com/seakayone/jfun.git'
                    url = 'https://github.com/seakayone/jfun'
                }
            }
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}
