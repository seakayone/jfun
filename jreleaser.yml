project:
  name: jFun
  description: Functional data structures for modern Java
  longDescription: Make functional programming on Java fun again
  links:
    homepage: https://github.com/seakayone/jfun
  authors:
    - Christian Kleinbölting
  license: APACHE-2.0
  inceptionYear: 2025
  stereotype: NONE
  languages:
    java:
      version: 23
      groupId: org.kleinb
      artifactId: jfun-core

release:
  github:
    overwrite: true
    changelog:
      formatted: ALWAYS
      preset: conventional-commits
      contributors:
        format: '- {{contributorName}}{{#contributorUsernameAsLink}} ({{.}}){{/contributorUsernameAsLink}}'

signing:
  active: ALWAYS
  pgp:
    armored: true
    mode: FILE

deploy:
  maven:
    mavenCentral:
      release-deploy:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - jfun/jfun-core/build/staging-deploy
